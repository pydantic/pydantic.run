name: CI

on:
  push:
    branches:
      - main
    tags:
      - '**'
  pull_request: {}

permissions: {}

env:
  COLUMNS: 150

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm ci

      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        with:
          extra_args: --all-files --verbose
        env:
          SKIP: no-commit-to-branch

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm ci

      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        name: Test deploy
        with:
          command: deploy --dry-run --env=
          workingDirectory: src/backend

  check:
    if: always()
    needs: [lint, build]
    runs-on: ubuntu-latest

    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}

  deploy-preview:
    if: success() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    needs: [check]
    permissions:
      contents: read
    environment:
      name: deploy-preview
      url: ${{ steps.get_preview_url.outputs.preview_url }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci

      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        name: Deploy pydantic-run-preview
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          environment: previews
          command: deploy --var GITHUB_SHA:${{ github.sha }}
          workingDirectory: src/backend

      - name: get preview URL
        id: get_preview_url
        run: python .github/get_preview_url.py >> $GITHUB_OUTPUT
        env:
          DEPLOY_OUTPUT: ${{ steps.deploy.outputs.command-output }}

  deploy:
    if: success() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [check]
    permissions:
      contents: read
    environment:
      name: deploy-prod
      url: https://pydantic.run

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci

      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        name: Deploy pydantic-run
        with:
          apiToken: ${{ secrets.cloudflare_api_token }}
          command: deploy --env= --var GITHUB_SHA:${{ github.sha }}
          workingDirectory: src/backend
